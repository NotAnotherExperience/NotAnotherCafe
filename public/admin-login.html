<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GG Vibe Officers Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-page login-page">
    <div class="wall-doodles" aria-hidden="true">
      <span>VIBE</span><span>GG</span><span>MENU</span><span>LOCK</span><span>BEV</span><span>SNACK</span>
      <span>CTRL</span><span>PS5</span><span>LIVE</span><span>ONLY</span><span>GG</span><span>KEY</span>
    </div>

    <main class="login-shell">
      <form id="loginForm" class="form-surface login-card">
        <a class="brand" href="/" aria-label="GG home">
          <span class="brand-mark">GG</span>
          <span>
          <strong>Vibe Officers</strong>
          <small>Not Another Cafe</small>
          </span>
        </a>
        <div>
          <p class="eyebrow">Vibe Officer access</p>
          <h1>Enter</h1>
        </div>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary-action" type="submit">Unlock page</button>
        <p id="loginMessage" class="form-message" role="status"></p>
      </form>
    </main>

    <script src="/admin-login.js"></script>
  </body>
</html>
